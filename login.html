  <main id="main" tabindex="-1" class="auth">
      <div class="auth__tools">
        <button type="button" class="icon-btn tool-btn" data-theme-toggle aria-label="Switch theme">
          <svg class="icon if-light" aria-hidden="true"><use href="#i-moon"/></svg>
          <svg class="icon if-dark" aria-hidden="true"><use href="#i-sun"/></svg>
        </button>
        <button type="button" class="icon-btn icon-btn--text tool-btn" data-dir-toggle aria-label="Switch layout direction"><span class="if-ltr">RTL</span><span class="if-rtl">LTR</span></button>
      </div>
      <div class="auth__media photo">
        <img src="public/assets/photos/login-hero.jpg" alt="A smiling traveller at an airport terminal holding a passport and boarding pass beside her suitcase" width="1200" height="1500" fetchpriority="high">
        <div class="auth__scrim" aria-hidden="true"></div>
        <div class="auth__caption"><svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg><p><strong>Client portal</strong>Your passport application, in one place.</p></div>
      </div>

      <div class="auth__panel">
        <div class="auth__card card reveal">
          <a class="auth__brand brand" href="index.html" aria-label="Meridian Passage, go to home">
            <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-logo"/></svg>
            <span class="brand-text"><span class="brand-name">Meridian Passage</span><span class="brand-sub">Passport Assistance</span></span>
          </a>

          <div class="auth-tabs" role="tablist" aria-label="Login or register">
            <button type="button" class="auth-tab" role="tab" id="tab-login" aria-controls="view-login" aria-selected="true" data-auth-tab="login">Login</button>
            <button type="button" class="auth-tab" role="tab" id="tab-register" aria-controls="view-register" aria-selected="false" tabindex="-1" data-auth-tab="register">Register</button>
          </div>

          <div class="auth-status" data-status role="status" aria-live="polite" hidden></div>

          <section id="view-login" role="tabpanel" aria-labelledby="tab-login" data-view="login">
            <h1 id="auth-title" class="auth__title">Welcome back</h1>
            <p class="auth__sub">Log in to your client portal.</p>
            <form class="auth-form" data-form="login" novalidate>
              <div class="field">
                <label class="label" for="lg-email">Email address</label>
                <input class="input" id="lg-email" name="email" type="email" autocomplete="email" inputmode="email" aria-required="true" aria-describedby="lg-email-error" placeholder="name@example.com">
                <p class="error-text" id="lg-email-error"></p>
              </div>
              <div class="field">
                <div class="label-row">
                  <label class="label" for="lg-password">Password</label>
                  <button type="button" class="text-link" data-forgot>Forgot password?</button>
                </div>
                <div class="pw">
                  <input class="input" id="lg-password" name="password" type="password" autocomplete="current-password" aria-required="true" aria-describedby="lg-password-error">
                  <button type="button" class="pw__toggle" data-toggle-password aria-controls="lg-password" aria-pressed="false" aria-label="Show password">
                    <svg class="icon if-hidden" aria-hidden="true"><use href="#i-eye"/></svg>
                    <svg class="icon if-shown" aria-hidden="true"><use href="#i-eye-off"/></svg>
                  </button>
                </div>
                <p class="error-text" id="lg-password-error"></p>
              </div>
              <button type="submit" class="btn btn-primary btn-lg btn-block">Log in</button>
            </form>
          </section>

          <section id="view-register" role="tabpanel" aria-labelledby="tab-register" data-view="register" hidden>
            <h2 class="auth__title">Create your account</h2>
            <p class="auth__sub">Register to use your client portal.</p>
            <form class="auth-form" data-form="register" novalidate>
              <div class="field">
                <label class="label" for="rg-name">Full name</label>
                <input class="input" id="rg-name" name="name" type="text" autocomplete="name" aria-required="true" aria-describedby="rg-name-error">
                <p class="error-text" id="rg-name-error"></p>
              </div>
              <div class="field">
                <label class="label" for="rg-email">Email address</label>
                <input class="input" id="rg-email" name="email" type="email" autocomplete="email" inputmode="email" aria-required="true" aria-describedby="rg-email-error" placeholder="name@example.com">
                <p class="error-text" id="rg-email-error"></p>
              </div>
              <div class="field">
              <label class="label" for="rg-password">Password</label>
              <div class="pw">
                <input class="input" id="rg-password" name="password" type="password" autocomplete="new-password" aria-required="true" aria-describedby="rg-password-error">
                <button type="button" class="pw__toggle" data-toggle-password aria-controls="rg-password" aria-pressed="false" aria-label="Show password">
                  <svg class="icon if-hidden" aria-hidden="true"><use href="#i-eye"/></svg>
                  <svg class="icon if-shown" aria-hidden="true"><use href="#i-eye-off"/></svg>
                </button>
              </div>
              <p class="error-text" id="rg-password-error"></p>
            </div>
              <div class="field">
              <label class="label" for="rg-confirm">Confirm password</label>
              <div class="pw">
                <input class="input" id="rg-confirm" name="confirm" type="password" autocomplete="new-password" aria-required="true" aria-describedby="rg-confirm-error">
                <button type="button" class="pw__toggle" data-toggle-password aria-controls="rg-confirm" aria-pressed="false" aria-label="Show password">
                  <svg class="icon if-hidden" aria-hidden="true"><use href="#i-eye"/></svg>
                  <svg class="icon if-shown" aria-hidden="true"><use href="#i-eye-off"/></svg>
                </button>
              </div>
              <p class="error-text" id="rg-confirm-error"></p>
            </div>
              <button type="submit" class="btn btn-primary btn-lg btn-block">Register</button>
            </form>
          </section>

          <p class="or-rule"><span>or</span></p>

          <div class="continue-to" role="group" aria-labelledby="continue-to-label">
            <p class="continue-to__label" id="continue-to-label">Continue to</p>
            <div class="continue-to__list">
              <button type="button" class="continue-to__opt" data-social="Google"><svg class="icon icon-brand" aria-hidden="true"><use href="#i-google"/></svg><span>Google</span></button>
              <button type="button" class="continue-to__opt" data-social="Apple"><svg class="icon icon-brand" aria-hidden="true"><use href="#i-apple"/></svg><span>Apple</span></button>
            </div>
          </div>
        </div>
      </div>
  </main>
</body>
</html>
